name: Release

# Pushing a tag drafts a GitHub release with the two files Obsidian installs.
# Review the draft's notes on GitHub, then publish it.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Test minification
        run: npm test

      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Check theme.css is built from src/
        run: |
          scripts/build.sh
          git diff --exit-code -- theme.css

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --draft \
            manifest.json theme.css
